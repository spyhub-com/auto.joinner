const SER=[["finds","Finds",[255,255,255]],["frozen","Frozen",[150,155,170]]],SHOW={finds:1,frozen:1};
function hist(){const H=36e5,now=Date.now(),b=Array.from({length:24},()=>({finds:0,frozen:0})),add=(t,k)=>{const i=23-Math.floor((now-t)/H);if(t&&i>=0&&i<24)b[i][k]++};
  DK.recent.forEach(x=>add(x.timestamp,"finds"));DK.logs.forEach(l=>{if(/frozen|freez|stuck|err|fail/i.test((l.type||"")+" "+(l.message||"")))add(l.timestamp,"frozen")});return b}
const CH={W:640,H:230,L:42,B:28,T:10};
function chartHtml(){const b=hist(),{W,H,L,B,T}=CH,cw=(W-L-6)/24,sh=SER.filter(s=>SHOW[s[0]]),mx=nice(Math.max(1,...b.flatMap(x=>sh.map(s=>x[s[0]])))),y=v=>T+(H-T-B)*(1-v/mx),lbl=i=>i===23?"Now":(23-i)+"h ago",pts=[];let g="",bars="",hit="";
  for(let i=0;i<=4;i++){const yy=y(mx*i/4);g+=`<line x1="${L}" x2="${W-6}" y1="${yy}" y2="${yy}" stroke="rgba(255,255,255,.08)"/><text x="${L-6}" y="${yy+4}" text-anchor="end">${int(mx*i/4)}</text>`}
  b.forEach((x,i)=>{const cx=L+cw*i+cw/2;if(SHOW.finds)bars+=`<rect x="${cx-cw*.33}" y="${y(x.finds)}" width="${cw*.66}" height="${Math.max(0,H-B-y(x.finds))}" rx="3" fill="rgb(${SER[0][2]})"/>`;if(SHOW.frozen)pts.push([cx,y(x.frozen)]);hit+=`<rect class="hit" data-i="${i}" x="${L+cw*i}" y="${T}" width="${cw}" height="${H-T-B}" fill="transparent"/>`});
  const col=`rgb(${SER[1][2]})`,ln=pts.length?`<path d="${pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("")}" fill="none" stroke="${col}" stroke-width="2"/>`+pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="${col}"/>`).join(""):"",xl=[0,6,12,18,23].map(i=>`<text x="${L+cw*i+cw/2}" y="${H-8}" text-anchor="middle">${lbl(i)}</text>`).join("");
  return`<div class="lg">${SER.map(s=>`<button class="${SHOW[s[0]]?"":"off"}" data-act="ser" data-k="${s[0]}"><i style="background:rgb(${s[2]})"></i>${s[1]}</button>`).join("")}</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Finds and frozen sessions per hour, last 24 hours">${g}${bars}${ln}${xl}${hit}</svg><div class="tip"></div><p class="dim" style="margin:6px 0 0;font-size:11.5px">${DK.upd?`Based on the latest ${DK.recent.length} finds, updated ${ago(DK.upd)}.`:"Loading data..."}</p>`}
const paintCharts=()=>{const e=$("#ch");if(e)e.innerHTML=chartHtml();paintStats()};

  t.innerHTML=`<b>${i===23?"Now":(23-i)+"h ago"}</b>`+SER.filter(s=>SHOW[s[0]]).map(s=>`<div><span><i style="background:rgb(${s[2]})"></i>${s[1]}</span><b style="color:#fff;margin:0">${int(x[s[0]])}</b></div>`).join("");t.style.left=Math.min(Math.max(0,r.left-cr.left+r.width/2-60),cr.width-130)+"px";t.style.top="44px";t.style.opacity=1});

function hwSynth(sr,onDone,yieldFn){
 var BEAT=.5,BARS=16,N=Math.round(BARS*3*BEAT*sr),L=new Float32Array(N),R=new Float32Array(N);

   var s=(o+d)%N;for(var i=0;i<len;i++){var j=s+i;if(j>=N)j-=N;L[j]+=src[i]*a;R[j]+=src[i]*b}}}

   if(kind=="box"){env=Math.exp(-i/sr*3.2);x=Math.sin(w*i)+.35*Math.sin(2*w*i)*Math.exp(-i/sr*6)+.12*Math.sin(3.01*w*i)*Math.exp(-i/sr*10)}
   else if(kind=="bass"){env=Math.exp(-i/sr*2.2);x=Math.sin(w*i)+.3*Math.sin(2*w*i)}
   else{env=1;x=Math.sin(w*i)+.5*Math.sin(w*i*1.004)+.25*Math.sin(2*w*i)}
   var a=i<att?i/att:1,r=i>len-rel?(len-i)/rel:1;a=a*a*(3-2*a);r=r*r*(3-2*r);s[i]=x*env*a*r}
  add(null,t,pan||0,gain,s,len)}
 var A=57,E=64;var bar=3*BEAT;
 var ch=[[57,60,64],[57,60,64],[50,53,57],[57,60,64],[53,57,60],[52,56,59],[57,60,64],[52,56,59]];
 var bs=[45,45,38,45,41,40,45,40];
 var mel=[[0,76,1],[1,72,1],[2,69,1],[3,72,1],[4,71,2],[6,69,1],[7,64,1],[8,69,1],[9,72,1],[10,76,1],[11,77,2],[13,76,1],[14,72,1],[15,69,1],

<script>
window.board=function(){
  const NR=r=>{const l=r.last||{};return{n:r.n??l.name??"?",v:+(r.v??l.value)||0,m:r.m??l.mut??"",u:r.u??r.name??r.username??"Player",avatar:r.avatar||"",t:r.t??l.t??0}},
  L=S.lb&&S.lb.map(NR),me=S.me&&S.me.user&&S.me.user.name,
  fl=`<h1 class="sm">Leaderboard</h1><div class="fl">${[["d","Today"],["w","This week"],["a","All time"]].map(([k,n])=>`<button class="b sm${S.f===k?" on":""}" data-act="filt" data-f="${k}">${n}</button>`).join("")}</div>`;
  if(!L)return fl+`<div class="box">${none("Leaderboard unavailable right now.")}</div>`;
  if(!L.length)return fl+`<div class="box">${none("No steals ranked yet.")}</div>`;
  const mine=S.me&&S.me.stl&&S.me.stl.top&&S.me.stl.top[0],
  best=mine?`<div class="box bst">${brImg(mine.name)}<div class="fx"><small>Your best steal</small><b>${esc(mine.name)}</b>${mutOf(mine.mut)?` <span class="mu">${esc(mutOf(mine.mut))}</span>`:""}</div><span class="vl">${fmt(mine.value)}</span></div>`:"",
  mu=r=>mutOf(r.m)?`<span class="mu">${esc(mutOf(r.m))}</span>`:"",
  who=r=>`<span class="pw">${av2(r.avatar,r.u)}<span>${esc(r.u)}</span></span>`,
  crown='<svg class="pcr" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18l1-11-5 4-5-7-5 7-5-4z" fill="#f5c451"/></svg>',
  DL=[".25s",".1s",".4s"],
  col=i=>{const r=L[i];return r?`<div class="pc p${i+1}" style="--d:${DL[i]}">${i===0?crown:""}<div class="rb">#${i+1}</div><div class="im"><span class="au"></span>${brImg(r.n)}</div><b class="nm" title="${esc(r.n)}">${esc(r.n)}</b>${mu(r)}<div class="vv">${fmt(r.v)}</div>${who(r)}<div class="pst"><span>${i+1}</span></div></div>`:`<div></div>`},
  rest=L.slice(3,10);
  return fl+best+`<div class="pdm2">${[1,0,2].map(col).join("")}</div>`+(rest.length?`<div class="box"><h2 class="lbh">Other players</h2>${rest.map((r,i)=>`<div class="rw${r.u===me?" me":""}"><span class="rn">#${i+4}</span>${brImg(r.n)}<div class="fx"><b>${esc(r.n)}</b> ${mu(r)}<div class="dim">${esc(r.u)}${r.t?" · "+ago(r.t):""}</div></div><span class="vl">${fmt(r.v)}</span></div>`).join("")}</div>`:"")};
if(typeof S!=="undefined"&&S.tab==="board")render();
