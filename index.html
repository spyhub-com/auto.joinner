<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SpyHub AJ</title>
<style>
:root{--ln:rgba(255,255,255,.3);--dim:#8a8a8a;--bad:#ff6b76;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse 90% 55% at 50% -12%,rgba(45,85,255,.30),transparent 70%),radial-gradient(ellipse 70% 45% at 100% 100%,rgba(15,35,140,.30),transparent 70%),radial-gradient(ellipse 60% 40% at 0 60%,rgba(30,60,200,.12),transparent 70%),#000;background-attachment:fixed;color:#fff;font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;overflow-x:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:1040px;min-height:100vh;margin:0 auto;padding:0 18px 28px;position:relative;z-index:1;display:flex;flex-direction:column}
main{flex:1;padding-top:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--ln)}
.brand{background:none;border:0;color:#fff;font:inherit;font-weight:800;font-size:17px;letter-spacing:-.03em;cursor:pointer;padding:0}
.hd{display:flex;align-items:center;gap:10px}
.chip{border:1px solid var(--ln);border-radius:999px;padding:5px 14px;font-weight:650}
nav{display:flex;gap:6px;overflow-x:auto;padding:14px 0 4px;scroll-snap-type:x proximity}
nav button{flex:0 0 auto;scroll-snap-align:start;background:none;border:1px solid var(--ln);color:var(--dim);border-radius:999px;padding:7px 15px;font:inherit;font-size:13px;cursor:pointer;transition:.3s ease}
nav button:hover{color:#fff;border-color:#fff}nav button[aria-current=page]{background:#fff;color:#000;border-color:#fff;font-weight:650}
h1{font-size:clamp(30px,8vw,62px);line-height:1;letter-spacing:-.045em;font-weight:800;margin:0 0 18px}
h1.sm{font-size:clamp(22px,5vw,34px);margin:14px 0 16px}
h2{font-size:16px;font-weight:750;letter-spacing:-.02em;margin:0 0 8px}p{margin:.4em 0}
.dim{color:var(--dim)}.bad{color:var(--bad)}a{color:#fff}
.hero{padding:7vh 0 3vh;max-width:820px}.lead{font-size:clamp(14px,2.2vw,17px);line-height:1.45;color:var(--dim);max-width:40ch;margin:0}
.cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:38px}
button{font:inherit}
.b{display:inline-block;background:none;color:#fff;border:1px solid #fff;border-radius:999px;padding:10px 20px;font-size:14px;font-weight:650;cursor:pointer;text-align:center;text-decoration:none;transition:.3s ease}
.b:hover:not(:disabled){background:#fff;color:#000}.b.s{background:#fff;color:#000}.b.s:hover:not(:disabled){background:none;color:#fff}
.b.sm{padding:6px 14px;font-size:13px}.b.w{width:100%}.b.out{color:var(--bad);border-color:rgba(255,107,118,.5);width:100%}.b.out:hover:not(:disabled){background:var(--bad);color:#000}
.b:active:not(:disabled){transform:scale(.98)}.b:disabled{opacity:.35;cursor:not-allowed}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
.box{border:1px solid var(--ln);border-radius:14px;padding:15px;margin-bottom:16px}
input[type=text]{width:100%;background:#000;border:1px solid var(--ln);color:#fff;border-radius:12px;padding:14px;font:inherit;margin:10px 0}
input[type=range]{width:100%;accent-color:#fff}
code{border:1px solid var(--ln);padding:2px 8px;border-radius:8px}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.big{font-size:26px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}.grid .box{margin:0}
@media(min-width:800px){.grid.g4{grid-template-columns:repeat(4,1fr)}}
.sx{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--ln);white-space:nowrap}th{color:var(--dim);font-weight:500;font-size:14px;border:0}
.av{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1px solid #fff;font-weight:800;vertical-align:middle;flex:none}.av.xl{width:72px;height:72px;font-size:30px}
.fl{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto}.fl .on{background:#fff;color:#000}
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end;margin-bottom:16px}.pc{padding:16px 8px;text-align:center;overflow:hidden;font-size:15px}.pc.p0{padding:34px 8px}.pc .av{display:grid;margin:0 auto 8px}
.me{background:rgba(255,255,255,.1)}
.pk{display:flex;flex-direction:column;gap:6px;position:relative}.pk h2{margin:0}.pk .b{margin-top:auto}
.badge{position:absolute;top:16px;right:16px;font-size:12px;font-weight:700;background:#fff;color:#000;border-radius:999px;padding:1px 10px}
.bar{height:8px;border-radius:9px;border:1px solid var(--ln);overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#fff;transition:width .5s ease}
.tl{display:flex;gap:4px;overflow-x:auto;padding:8px 2px 12px;scroll-snap-type:x proximity}
.cell{flex:0 0 34px;display:flex;flex-direction:column-reverse;align-items:center;gap:3px;background:none;border:1px solid transparent;border-radius:10px;padding:5px 0;cursor:pointer;scroll-snap-align:start;color:var(--dim);font-size:12px}
.cell .lb{height:16px;order:9}.cell i{display:block;width:18px;height:8px;border-radius:3px;border:1px solid #fff}.cell i.on{background:rgba(255,255,255,.2);border-color:transparent}
.cell.full{cursor:not-allowed;opacity:.45}.cell.sel{border-color:#fff;color:#fff;background:rgba(255,255,255,.1)}
.tg{width:52px;height:30px;border-radius:999px;border:1px solid var(--ln);background:none;padding:2px;cursor:pointer;text-align:left}.tg i{display:block;width:24px;height:24px;border-radius:50%;background:var(--dim);transition:transform .3s ease}.tg.on i{background:#fff;transform:translateX(22px)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#000;padding:12px 20px;border-radius:999px;font-weight:650;max-width:90%;z-index:9}
.flash{animation:fl 1.2s ease}@keyframes fl{20%{box-shadow:0 0 0 2px #fff}}
.back{margin-top:8px}.legal h2{margin-top:22px}
footer{border-top:1px solid var(--ln);margin-top:40px;padding-top:18px;display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px;color:var(--dim)}
footer button{background:none;border:0;color:var(--dim);cursor:pointer;padding:0;font-size:14px}footer button:hover{color:#fff}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.gt,h1,.big,.brand{background:linear-gradient(110deg,#fff 0%,#a9c8ff 30%,#4f7bff 65%,#1d3fb8 100%);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gs 10s ease-in-out infinite alternate}
@keyframes gs{to{background-position:100% 50%}}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}.rv.in{opacity:1;transform:none}
.pill{display:inline-block;border:1px solid rgba(120,160,255,.45);color:#a9c8ff;border-radius:999px;padding:4px 12px;font-size:12px;margin-bottom:18px}
.sec{margin-top:40px}.sh{font-size:clamp(19px,4vw,28px);letter-spacing:-.035em;margin:0 0 18px}
.fg{display:grid;gap:14px;grid-template-columns:1fr}.fc{margin:0;transition:border-color .3s ease,transform .3s ease}.fc:hover{border-color:rgba(120,160,255,.6);transform:translateY(-3px)}.fc h3{margin:0 0 4px;font-size:15px}
.num{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid rgba(120,160,255,.6);border-radius:50%;margin-bottom:10px;font-weight:700}
.pr{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
details.box{margin-bottom:10px;padding:14px 18px}summary{cursor:pointer;font-weight:650;font-size:14px}
.cta2{text-align:center;padding:34px 18px}.cta2 .cta{justify-content:center}
@media(min-width:640px){.fg{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.fg{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.cta .b{flex:1}}
@media(prefers-reduced-motion:reduce){.gt,h1,.big,.brand{animation:none}.rv{opacity:1;transform:none}}

/* ===== 3D layer ===== */
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0;transition:opacity .6s ease}
.floor{position:fixed;left:-50%;right:-50%;bottom:0;height:48vh;z-index:0;pointer-events:none;perspective:380px;overflow:hidden;opacity:.5;-webkit-mask-image:linear-gradient(to top,#000 0%,transparent 90%);mask-image:linear-gradient(to top,#000 0%,transparent 90%)}
.floor i{position:absolute;left:0;right:0;bottom:0;height:200%;background:linear-gradient(rgba(79,123,255,.6) 1px,transparent 1px) 0 0/100% 60px,linear-gradient(90deg,rgba(79,123,255,.6) 1px,transparent 1px) 0 0/80px 100%;transform:rotateX(72deg);transform-origin:50% 100%;animation:fm 2.6s linear infinite}
@keyframes fm{to{background-position:0 60px,0 0}}
.rv{transform:perspective(900px) rotateX(14deg) translateY(34px);transform-origin:50% 100%}
.rv.in{transform:none}
.tilt{position:relative;transform-style:preserve-3d;will-change:transform;transition:transform .25s ease,border-color .3s ease,box-shadow .3s ease}
.tilt.mv{transition:border-color .3s ease,box-shadow .3s ease}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(130,170,255,.28),transparent 55%);opacity:0;transition:opacity .3s}
.tilt:hover::after{opacity:1}
.tilt:hover{box-shadow:0 18px 50px -18px rgba(60,100,255,.7)}
.box{background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.b.s{box-shadow:0 0 26px rgba(79,123,255,.55)}
.b:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 28px -6px rgba(79,123,255,.8)}
main.pg{animation:pg .6s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes pg{from{opacity:0;transform:perspective(1000px) rotateX(8deg) translateY(22px)}}
.pod .pc{animation:rise 1s cubic-bezier(.2,.8,.2,1) backwards;transform-origin:50% 100%}
.pod .pc.p0{animation-delay:.25s}.pod .pc.p1{animation-delay:.1s}.pod .pc.p2{animation-delay:.4s}
@keyframes rise{from{opacity:0;transform:perspective(700px) rotateX(-50deg) translateY(80px)}}
.pod .pc.p0{box-shadow:0 0 40px -8px rgba(79,123,255,.8);border-color:rgba(140,180,255,.8)}
.hero h1{filter:drop-shadow(0 6px 30px rgba(45,85,255,.55))}
@media(hover:none){.tilt::after{display:none}}
@media(prefers-reduced-motion:reduce){.floor i,.pod .pc,main.pg{animation:none}.rv{transform:none}.tilt{transform:none!important}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas><div class="floor" aria-hidden="true"><i></i></div><canvas id="gl" aria-hidden="true"></canvas>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== Settings: put your Worker URL in API_BASE and fill in the legal details ===== */
const CONFIG={API_BASE:"",LOGIN_PATH:"/api/site/auth/discord",SEATS:4,STEP:30,MAX_MIN:120,HORIZON_H:24,PRICE_PER_HOUR:1,
  LEGAL:{publisher:"",country:"",email:""}};
const CELL=CONFIG.STEP*60000,A="/api/site",$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+(+n||0).toFixed(2),hm=ms=>new Date(ms).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"});
const day=ms=>new Date(ms).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
const dur=m=>m>=60?(m%60?Math.floor(m/60)+" h "+m%60:m/60+" h"):m+" min";
const fmt=n=>{n=+n||0;for(const[u,v]of[["B",1e9],["M",1e6],["K",1e3]])if(n>=v)return"$"+(n/v).toFixed(1)+u+"/s";return"$"+Math.round(n)+"/s"};
const ago=t=>{const s=Math.max(1,Math.round((Date.now()-t)/1e3));return(s<60?s+"s":s<3600?Math.round(s/60)+"m":Math.round(s/3600)+"h")+" ago"};
const S={me:null,tab:"home",start:null,dur:60,taken:{},busy:false,f:"a",notif:true,end:0,stats:null,list:null,lb:null,err:""};

/* ===== Network (Bearer token on /api/site routes) ===== */
const tok=()=>{try{return localStorage.getItem("spyaj_t")||""}catch{return""}},setTok=t=>{try{t?localStorage.setItem("spyaj_t",t):localStorage.removeItem("spyaj_t")}catch{}};
{const m=location.hash.match(/[#&]t=([\w.-]+)/);if(m){setTok(m[1]);history.replaceState(null,"",location.pathname)}}
async function api(path,body){
  if(!CONFIG.API_BASE)return{ok:false,status:0,data:{error:"API not configured: set CONFIG.API_BASE"}};
  try{const r=await fetch(CONFIG.API_BASE+path,{method:body?"POST":"GET",credentials:"include",headers:{...(body?{"Content-Type":"application/json"}:{}),...(tok()&&path.startsWith(A)?{Authorization:"Bearer "+tok()}:{})},body:body?JSON.stringify(body):undefined});
    let d={};try{d=await r.json()}catch{}if(!r.ok&&!d.error)d.error=r.status===404?"API not found (404), check CONFIG.API_BASE":"Error "+r.status;return{ok:r.ok,status:r.status,data:d}}
  catch{return{ok:false,status:0,data:{error:"Server unreachable (wrong URL or CORS)"}}}
}
function toast(t){document.querySelector(".toast")?.remove();const e=document.createElement("div");e.className="toast";e.setAttribute("role","status");e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}

/* ===== Data ===== */
const first=()=>Math.floor(Date.now()/CELL)+1,count=()=>CONFIG.HORIZON_H*60/CONFIG.STEP;
const win=()=>S.start==null?[]:Array.from({length:S.dur/CONFIG.STEP},(_,i)=>S.start+i);
const winOk=()=>{const w=win();return w.length>0&&w.every(c=>c in S.taken&&S.taken[c]<CONFIG.SEATS)};
async function loadAvail(){if(!S.me)return;const f=first(),r=await api(`${A}/availability?from=${f}&to=${f+count()-1}`);if(r.ok)S.taken=r.data.taken||{}}
async function loadStats(){
  const[a,b]=await Promise.all([api("/api/stats"),api("/api/brainrots?limit=10&sort=mps")]);
  S.err=a.ok?"":(a.data.error||"");S.stats=a.ok?a.data:null;const d=b.data;S.list=b.ok?(Array.isArray(d)?d:d.brainrots||d.items||[]):null;
  if(S.tab==="stats")paintStats()}
async function loadBoard(){const r=await api(`${A}/leaderboard?range=${S.f}`);S.lb=r.ok?(r.data.rows||[]):null;if(S.tab==="board")render()}
async function load(){
  const r=await api(A+"/me");
  S.me=r.ok?{user:r.data.user,balance:r.data.balance||0,hours:r.data.hours||0,gifts:r.data.gifts||[],stats:r.data.stats,license:r.data.license||{key:"",hwidResetAt:0},reservations:r.data.reservations||[]}:null;
  if(S.me)await loadAvail();render()}

/* ===== Views ===== */
const STEPS=[["Sign in","Log in with your Discord account."],["Book a slot","Pick a start time and a duration."],["Run the script","Paste your key and let the auto-join work."]];
const FAQ=[["What if I don't connect during my slot?","The slot keeps running, you just don't use it."],["How many people at once?","4 users maximum per slot."],["How do I pay?","With your balance, topped up by gift card. There is no subscription."],["I changed device, what now?","Reset your HWID from Settings, once per day."],["Is it affiliated with Roblox?","No. SpyHub AJ is independent. See the Legal Notice."]];
const ctas=`<div class="cta"><button class="b s" data-act="dash">Get Dashboard</button><button class="b" data-act="tab" data-t="stats">Live Stats</button></div>`;
const home=()=>`<section class="hero rv"><span class="pill">Auto join · Real-time · 4 seats per slot</span><h1>SpyHub Auto Joinner</h1><p class="lead">Spots the best brainrots live and joins the right server for you. Book a slot, run the script, that's it.</p>${ctas}</section>
<section class="sec rv"><h2 class="gt sh">How it works</h2><div class="fg">${STEPS.map(([t,d],i)=>`<div class="box fc"><span class="num">${i+1}</span><h3>${t}</h3><p class="dim">${d}</p></div>`).join("")}</div></section>
<section class="sec rv"><div class="box pr"><div><h2 class="gt sh" style="margin:0">Simple pricing</h2><p class="dim">Pay with your balance. No subscription, no commitment.</p></div><div><span class="big">${money(CONFIG.PRICE_PER_HOUR)}</span><span class="dim"> / hour</span></div></div></section>
<section class="sec rv"><h2 class="gt sh">FAQ</h2>${FAQ.map(([q,a])=>`<details class="box"><summary>${q}</summary><p class="dim">${a}</p></details>`).join("")}</section>
<section class="sec rv box cta2"><h2 class="gt sh">Join the right server first.</h2>${ctas}</section>`;
const none=t=>`<p class="dim">${t}</p>`;
function statsHtml(){
  const s=S.stats,l=S.list;
  if(!s&&!l)return`<div class="box"><h2>Live Stats</h2>${none("Data unavailable."+(S.err?" "+esc(S.err)+".":""))}</div>`;
  const c=(k,v)=>`<div class="box"><span class="dim">${k}</span><div class="big">${v}</div></div>`;
  return(s?`<div class="grid g4">${c("In database",s.total??"—")}${c("Today",s.activeToday??"—")}${c("Active scanners",s.scanners??"—")}${c("Top value",s.topMps!=null?fmt(s.topMps):"—")}</div>`:"")
  +`<div class="box"><h2>Top brainrots</h2>${l&&l.length?`<div class="sx"><table><thead><tr><th>Name</th><th>Value</th><th>Found</th></tr></thead><tbody>${l.map(b=>`<tr><td>${esc(b.name)}</td><td>${fmt(b.mps)}</td><td class="dim">${b.timestamp?ago(b.timestamp):"—"}</td></tr>`).join("")}</tbody></table></div>`:none("No brainrots yet.")}</div>`}
const stats=()=>`<h1 class="sm">Live Stats</h1><div id="st" aria-live="polite">${statsHtml()}</div>`;
const paintStats=()=>{const e=$("#st");if(e)e.innerHTML=statsHtml()};
const PACKS=[[1,1],[5,.9],[10,.8],[24,.7]],price=(h,d)=>+(CONFIG.PRICE_PER_HOUR*h*d).toFixed(2);
function buy(){
  let live=none("Sign in to see live availability.");
  if(S.me){const now=Math.floor(Date.now()/CELL),o=S.taken[now],nx=Object.keys(S.taken).map(Number).sort((a,b)=>a-b).find(c=>c>=now&&S.taken[c]<CONFIG.SEATS);
    live=o==null?none("Availability unavailable."):`<p><b>${o} / ${CONFIG.SEATS}</b> slots in use right now</p><div class="bar"><i style="width:${o/CONFIG.SEATS*100}%"></i></div>${none("Next free slot: "+(nx==null?"none in the next 24 h":nx===now?"now":hm(nx*CELL)))}`}
  return`<h1 class="sm">Buy</h1><div class="grid g4">${PACKS.map(([h,d])=>{const p=price(h,d),sv=CONFIG.PRICE_PER_HOUR*h-p;return`<div class="box pk">${h===10?'<span class="badge">Popular</span>':""}<h2>${h} h</h2><div class="big">${money(p)}</div>${none(sv>0?"You save "+money(sv):"Hourly rate")}<button class="b${h===10?" s":""}" data-act="buy" data-h="${h}">Pre-order</button></div>`}).join("")}</div>
  <div class="box" aria-live="polite"><h2>Live availability</h2>${live}</div>`}
function board(){
  const L=S.lb,me=S.me?.user?.name,ini=n=>esc(String(n||"?")[0].toUpperCase());
  const flt=`<h1 class="sm">Leaderboard</h1><div class="fl">${[["d","Today"],["w","This week"],["a","All time"]].map(([k,n])=>`<button class="b sm${S.f===k?" on":""}" data-act="filt" data-f="${k}">${n}</button>`).join("")}</div>`;
  if(!L)return flt+`<div class="box">${none("Leaderboard unavailable right now.")}</div>`;
  if(!L.length)return flt+`<div class="box">${none("No ranked players yet.")}</div>`;
  const pc=(r,i)=>`<div class="box pc p${i}${r.name===me?" me":""}"><span class="av">${ini(r.name)}</span><b>#${i+1} ${esc(r.name)}</b><p class="dim">${+r.count||0} caught</p><b>${fmt(r.value)}</b></div>`;
  return flt+(L.length>=3?`<div class="pod">${[1,0,2].map(i=>pc(L[i],i)).join("")}</div>`:"")
  +`<div class="box sx"><table><thead><tr><th>#</th><th>Player</th><th>Caught</th><th>Total value</th></tr></thead><tbody>${L.slice(0,10).map((r,i)=>`<tr class="${r.name===me?"me":""}"><td>${i+1}</td><td><span class="av">${ini(r.name)}</span> ${esc(r.name)}</td><td>${+r.count||0}</td><td>${fmt(r.value)}</td></tr>`).join("")}</tbody></table></div>`}
function slots(){
  let cells="";const f=first();
  for(let i=0;i<count();i++){const c=f+i,t=S.taken[c]??0,ms=c*CELL,d=new Date(ms),full=t>=CONFIG.SEATS;
    cells+=`<button class="cell${full?" full":""}" data-act="cell" data-c="${c}" ${full?"disabled":""} aria-label="${hm(ms)}, ${CONFIG.SEATS-t} seats free"><span class="lb">${d.getMinutes()===0?d.getHours()+"h":""}</span>${Array.from({length:CONFIG.SEATS},(_,k)=>`<i class="${k<t?"on":""}"></i>`).join("")}</button>`}
  return`<h1 class="sm">Slots</h1><div class="box"><h2>When?</h2>${none("Each column is "+CONFIG.STEP+" min. Empty bars are free seats out of "+CONFIG.SEATS+".")}<div class="tl">${cells}</div>
  <div class="line"><label for="dur">Duration</label><b id="dl"></b></div><input id="dur" type="range" min="${CONFIG.STEP}" max="${CONFIG.MAX_MIN}" step="${CONFIG.STEP}" value="${S.dur}"></div>
  <div class="box"><div id="sum" aria-live="polite"></div></div><button class="b s w" id="go" data-act="reserve" disabled>Book this slot</button>`}
function upd(){
  const w=new Set(win());document.querySelectorAll(".cell").forEach(b=>b.classList.toggle("sel",w.has(+b.dataset.c)));
  $("#dl").textContent=dur(S.dur);const el=$("#sum"),btn=$("#go");
  if(S.start==null){el.innerHTML='<span class="dim">Tap a start time on the timeline.</span>';btn.disabled=true;return}
  const ok=winOk(),p=CONFIG.PRICE_PER_HOUR*S.dur/60,after=S.me.balance-p,s=S.start*CELL,e=s+S.dur*60000;
  el.innerHTML=`<b>${day(s)}, ${hm(s)} to ${hm(e)}</b><p>Price: ${money(p)}. Balance after purchase: ${money(Math.max(after,0))}.</p>`+(!ok?`<p class="bad">No free seat for the whole duration.</p>`:after<0?`<p class="bad">Not enough balance. <a href="#" data-act="tab" data-t="gift">Top up</a></p>`:"");
  btn.disabled=!ok||after<0||S.busy}
const gift=()=>`<h1 class="sm">Giftcard</h1><div class="box" id="gb"><h2>Redeem a gift card</h2>${none("The amount is added to your balance. Each code works once.")}<label for="code" class="dim">Code</label><input id="code" type="text" placeholder="SPY.AJ_XXXXXXXXXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="b s w" data-act="redeem">Redeem code</button></div>
<div class="box"><h2>History</h2>${S.me.gifts.length?`<div class="sx"><table><thead><tr><th>Code</th><th>Amount</th><th>Date</th></tr></thead><tbody>${S.me.gifts.map(g=>`<tr><td><code>${esc(g.code)}</code></td><td>${money(g.v)}</td><td class="dim">${new Date(g.t).toLocaleString("en-US")}</td></tr>`).join("")}</tbody></table></div>`:none("No codes redeemed yet.")}</div>`;
function settings(){
  const l=S.me.license,left=l.hwidResetAt+864e5-Date.now(),can=left<=0;
  return`<h1 class="sm">Settings</h1><div class="box"><h2>Your license</h2>${none("Paste this key into the script.")}<div class="line"><code id="key">${l.key?"spy_****"+esc(l.key.slice(-4)):"—"}</code><span><button class="b sm" data-act="show">Show</button> <button class="b sm" data-act="copy">Copy</button></span></div></div>
  <div class="box"><h2>Device (HWID)</h2>${none((l.hwidBound?"Your license is bound to a device.":"No device bound.")+" You can reset it once a day.")}<button class="b sm" data-act="hwid" ${can?"":"disabled"} style="margin-top:8px">Reset HWID</button>${can?"":none("Available in "+Math.ceil(left/36e5)+" h.")}</div>
  <div class="box"><h2>Preferences</h2><div class="line"><span>Theme</span><span class="dim">Dark only</span></div><div class="line"><span id="nl">Notifications</span><button class="tg${S.notif?" on":""}" role="switch" aria-checked="${S.notif}" aria-labelledby="nl" data-act="notif"><i></i></button></div></div>
  <button class="b out" data-act="logout">Log out</button>`}
function dash(){
  const m=S.me,now=Date.now(),R=[...m.reservations].sort((a,b)=>b.start-a.start),cur=R.find(r=>now>=r.start&&now<r.end),mn=R.reduce((a,r)=>a+(r.end-r.start)/6e4,0),sp=R.reduce((a,r)=>a+r.price,0),nm=esc(m.user?.name||"Player");
  S.end=cur?cur.end:0;
  return`<h1 class="sm">Dashboard</h1><div class="box"><div class="line" style="justify-content:flex-start;gap:16px"><span class="av xl">${nm[0]?.toUpperCase()||"?"}</span><div><h2>${nm}</h2>${none("ID "+esc(m.user?.id||"—"))}</div></div></div>
  <div class="grid"><div class="box"><span class="dim">Balance</span><div class="big">${money(m.balance)}</div><button class="b sm" data-act="tab" data-t="gift" style="margin-top:10px">Top up</button></div>
  <div class="box"><span class="dim">Current slot</span>${cur?`<div class="big" id="cd">--:--:--</div>${none(hm(cur.start)+" to "+hm(cur.end))}`:`${none("None")}<button class="b sm" data-act="tab" data-t="slots" style="margin-top:10px">Book a slot</button>`}</div></div>
  <div class="box"><h2>My stats</h2><div class="line"><span class="dim">Brainrots caught</span><b>${m.stats?.captured??"—"}</b></div><div class="line"><span class="dim">Auto-join time</span><b>${dur(mn)}</b></div><div class="line"><span class="dim">Balance spent</span><b>${money(sp)}</b></div></div>
  <div class="box"><h2>History</h2>${R.length?`<div class="sx"><table><thead><tr><th>Date</th><th>Duration</th><th>Price</th><th>Status</th></tr></thead><tbody>${R.slice(0,5).map(r=>`<tr><td>${new Date(r.start).toLocaleDateString("en-US")} ${hm(r.start)}</td><td>${dur((r.end-r.start)/6e4)}</td><td>${money(r.price)}</td><td>${now<r.start?"Upcoming":now<r.end?"Active":"Done"}</td></tr>`).join("")}</tbody></table></div>`:none("No bookings yet.")}</div>`}

/* ===== Legal pages (fill in CONFIG.LEGAL and have them reviewed) ===== */
const tbc=v=>v?esc(v):"[to be completed]",LG=CONFIG.LEGAL;
const LEGAL={
 legal:["Legal Notice",[["Publisher",`SpyHub AJ is published by ${tbc(LG.publisher)} (${tbc(LG.country)}). Contact: ${tbc(LG.email)}.`],["Hosting","The website is hosted on GitHub Pages. The API runs on Cloudflare Workers."],["Intellectual property","All content on this site belongs to its publisher. SpyHub AJ is an independent product, not affiliated with, endorsed by or sponsored by Roblox Corporation."]]],
 terms:["Terms of Service",[["Service","SpyHub AJ is an auto-join tool that detects brainrots and joins servers. It is sold as time slots, with a maximum of 4 users per slot."],["Account and license","You sign in with Discord. Your license key and device (HWID) are personal. Sharing them is forbidden and may lead to a ban without refund."],["Balance","Your balance is topped up with gift cards. It is not transferable and has no cash value."],["Use at your own risk","Third-party scripts may break the rules of the games you play. You are solely responsible for how you use the service, which is provided as is, without warranty."],["Termination","Access may be suspended for abuse or breach of these terms."],["Changes","These terms may change. Continuing to use the site means you accept them."]]],
 privacy:["Privacy Policy",[["Data we collect","Your Discord ID and username, license key, device identifier (HWID), balance, gift card history and bookings."],["Why","To run your account, enforce the 4-user limit and prevent license sharing. Your data is never sold."],["Processors","Discord (sign-in) and Cloudflare (API hosting)."],["Browser storage","A session token is stored in your browser (localStorage) to keep you signed in."],["Your rights","You can request access, correction or deletion of your data at "+tbc(LG.email)+"."]]],
 refund:["Refund Policy",[["Digital goods","Balance, gift cards and purchased time are digital and non-refundable once used or started."],["Booked slots","A booked slot runs from its start time to its end time whether or not you connect."],["Problems","If a technical fault on our side prevents you from using a paid slot, contact "+tbc(LG.email)+" and your request will be reviewed."]]]};
const legal=()=>{const[t,sec]=LEGAL[S.tab];return`<h1 class="sm">${t}</h1><div class="legal">${sec.map(([h,p])=>`<h2>${h}</h2><p class="dim">${p}</p>`).join("")}</div>`};

/* ===== Rendering ===== */
const TABS=[["dash","Dashboard"],["slots","Slots"],["buy","Buy"],["gift","Giftcard"],["stats","Stats"],["board","Leaderboard"],["settings","Settings"]];
function render(){
  const V={home,stats,buy,board,slots,gift,settings,dash,legal,terms:legal,privacy:legal,refund:legal};
  if(!S.me&&["buy","board","slots","gift","settings","dash"].includes(S.tab))S.tab="home";
  $("#app").innerHTML=`<header><button class="brand" data-act="tab" data-t="home">SpyHub AJ</button><span class="hd">${S.me?`<span class="chip" aria-label="Balance">${money(S.me.balance)}</span><button class="b sm" data-act="tab" data-t="settings">Account</button>`:'<button class="b sm" data-act="login">Login</button>'}</span></header>
  ${S.me?`<nav aria-label="Navigation">${TABS.map(([id,n])=>`<button data-act="tab" data-t="${id}" ${S.tab===id?'aria-current="page"':""}>${n}</button>`).join("")}</nav>`:""}
  <main>${S.tab!=="home"&&!S.me?'<button class="b sm back" data-act="tab" data-t="home">← Back</button>':""}${V[S.tab]()}</main>
  <footer><span>© SpyHub AJ</span>${[["legal","Legal Notice"],["terms","Terms of Service"],["privacy","Privacy Policy"],["refund","Refund Policy"]].map(([id,n])=>`<button data-act="tab" data-t="${id}">${n}</button>`).join("")}</footer>`;
  if(S.tab==="slots")upd();
  if(S._t!==S.tab){S._t=S.tab;$("main").classList.add("pg")}
  document.querySelectorAll(".fc,.pk,.pc,.grid>.box").forEach(e=>e.classList.add("tilt"));reveal()}

/* ===== Actions ===== */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;if(a==="tab")e.preventDefault();
  const login=()=>{if(!CONFIG.API_BASE)return toast("API not configured: set CONFIG.API_BASE");location.href=CONFIG.API_BASE+CONFIG.LOGIN_PATH+"?return="+encodeURIComponent(location.origin+location.pathname)};
  if(a==="login")login();
  else if(a==="dash"){if(!S.me)login();else{S.tab="dash";render()}}
  else if(a==="tab"){S.tab=b.dataset.t;render();scrollTo(0,0);
    if(S.tab==="stats")loadStats();else if(S.tab==="board")loadBoard();else if(S.tab==="buy"||S.tab==="slots"){await loadAvail();render()}}
  else if(a==="cell"){S.start=+b.dataset.c;upd()}
  else if(a==="reserve"){S.busy=true;upd();const r=await api(A+"/reserve",{start:S.start*CELL,minutes:S.dur});S.busy=false;
    if(r.ok){S.me.balance=r.data.balance;S.me.reservations.push(r.data.reservation);S.start=null;toast("Slot booked");S.tab="dash";await loadAvail();render()}
    else{toast(r.data.error||"Booking failed");await loadAvail();render()}}
  else if(a==="buy"){if(!S.me)return toast("Log in to buy");const h=+b.dataset.h,r=await api(A+"/buy",{hours:h});
    if(r.ok){S.me.balance=r.data.balance;toast(h+" h pack purchased");render()}else toast(r.data.error||"Purchase failed")}
  else if(a==="redeem"){const c=$("#code").value.trim();if(!c)return toast("Enter a code");const r=await api(A+"/giftcard",{code:c});
    if(r.ok){toast(money(r.data.added)+" added to your balance");await load();$("#gb")?.classList.add("flash")}else toast(r.data.error||"Code refused")}
  else if(a==="show"){$("#key").textContent=S.me.license.key||"—"}
  else if(a==="copy"){try{await navigator.clipboard.writeText(S.me.license.key);toast("Key copied")}catch{toast("Copy failed, tap Show")}}
  else if(a==="hwid"){const r=await api(A+"/hwid/reset",{});if(r.ok){S.me.license.hwidResetAt=r.data.hwidResetAt;S.me.license.hwidBound=false;toast("HWID reset");render()}else toast(r.data.error||"Reset failed")}
  else if(a==="filt"){S.f=b.dataset.f;S.lb=null;render();loadBoard()}
  else if(a==="notif"){S.notif=!S.notif;render()}
  else if(a==="logout"){await api(A+"/logout",{});setTok("");S.me=null;S.tab="home";S.start=null;render()}
});
document.addEventListener("input",e=>{if(e.target.id==="dur"){S.dur=+e.target.value;upd()}});

/* ===== Refresh: countdown 1 s, history 30 s, stats 5 s ===== */
setInterval(()=>{const c=$("#cd");if(!c)return;const l=Math.max(0,S.end-Date.now()),p=n=>String(n).padStart(2,"0");c.textContent=p(l/36e5|0)+":"+p(l/6e4%60|0)+":"+p(l/1e3%60|0);if(!l)render()},1000);
setInterval(()=>{if(S.me&&S.tab==="dash")render()},30000);
setInterval(()=>{if(S.tab==="stats")loadStats()},5000);
/* ===== Falling dots background ===== */
(()=>{const cv=$("#fx"),cx=cv.getContext("2d"),still=matchMedia("(prefers-reduced-motion:reduce)").matches,dpr=Math.min(devicePixelRatio||1,2);let W,H,D=[];
  const mk=top=>({x:Math.random()*W,y:top?-10:Math.random()*H,r:Math.random()*1.7+.4,v:Math.random()*.5+.15,d:Math.random()*.4-.2,a:Math.random()*.6+.2,b:Math.random()<.45});
  function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);const n=Math.round(Math.min(110,W*H/14000));while(D.length<n)D.push(mk());D.length=n}
  function tick(){cx.clearRect(0,0,W,H);for(const p of D){p.y+=p.v;p.x+=p.d;if(p.y>H+5||p.x<-5||p.x>W+5)Object.assign(p,mk(true));cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fillStyle=p.b?`rgba(110,160,255,${p.a})`:`rgba(255,255,255,${p.a*.7})`;cx.fill()}if(!still)requestAnimationFrame(tick)}
  addEventListener("resize",size);size();tick()})();
/* ===== Card tilt 3D ===== */
(()=>{if(matchMedia("(hover:none),(prefers-reduced-motion:reduce)").matches)return;let cur=null;
  const reset=()=>{if(cur){cur.classList.remove("mv");cur.style.transform="";cur=null}};
  document.addEventListener("pointermove",e=>{const t=e.target.closest&&e.target.closest(".tilt");if(t!==cur)reset();if(!t)return;cur=t;t.classList.add("mv");
    const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    t.style.setProperty("--mx",x*100+"%");t.style.setProperty("--my",y*100+"%");
    t.style.transform=`perspective(800px) rotateX(${(.5-y)*12}deg) rotateY(${(x-.5)*14}deg) translateZ(8px)`},{passive:true});
  document.addEventListener("pointerleave",reset);document.addEventListener("scroll",reset,{passive:true})})();
/* ===== 3D crystal (Three.js) ===== */
(()=>{if(!window.THREE)return;const cv=$("#gl");let R;try{R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true})}catch{return}
  const still=matchMedia("(prefers-reduced-motion:reduce)").matches,dpr=Math.min(devicePixelRatio||1,2);let W,H;
  const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,100);cam.position.z=8;
  const g=new THREE.Group();sc.add(g);
  const core=new THREE.Mesh(new THREE.IcosahedronGeometry(1,0),new THREE.MeshStandardMaterial({color:0x2d55ff,metalness:.7,roughness:.2,flatShading:true,emissive:0x0a1a66,emissiveIntensity:.9}));
  const wire=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(1.4,1)),new THREE.LineBasicMaterial({color:0xa9c8ff,transparent:true,opacity:.4}));
  const inner=new THREE.Mesh(new THREE.OctahedronGeometry(.55),new THREE.MeshBasicMaterial({color:0xcfe0ff,wireframe:true}));
  const rm=new THREE.MeshBasicMaterial({color:0x6ea0ff,transparent:true,opacity:.8}),ring=new THREE.Mesh(new THREE.TorusGeometry(1.9,.014,8,140),rm),ring2=new THREE.Mesh(new THREE.TorusGeometry(2.2,.01,8,140),rm);
  ring.rotation.x=1.2;ring2.rotation.set(.4,0,1.1);
  const N=240,pa=new Float32Array(N*3);for(let i=0;i<N;i++){const r=2.1+Math.random()*1.7,t=Math.random()*6.283,p=Math.acos(2*Math.random()-1);pa[i*3]=r*Math.sin(p)*Math.cos(t);pa[i*3+1]=r*Math.sin(p)*Math.sin(t);pa[i*3+2]=r*Math.cos(p)}
  const pg=new THREE.BufferGeometry();pg.setAttribute("position",new THREE.BufferAttribute(pa,3));
  const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0x8fb4ff,size:.045,transparent:true,opacity:.85}));
  g.add(core,wire,inner,ring,ring2,pts);
  sc.add(new THREE.AmbientLight(0x4466aa,.7));
  const l1=new THREE.PointLight(0x7aa2ff,1.8);l1.position.set(4,3,5);const l2=new THREE.PointLight(0xffffff,1.1);l2.position.set(-4,-2,4);const l3=new THREE.PointLight(0x2d55ff,2);l3.position.set(0,-4,-3);sc.add(l1,l2,l3);
  let mx=0,my=0,cx=0,cy=0;addEventListener("pointermove",e=>{mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1},{passive:true});
  function size(){W=innerWidth;H=innerHeight;R.setPixelRatio(dpr);R.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix()}
  function frame(t){
    if(!still)requestAnimationFrame(frame);
    const h=$(".hero");if(!h){cv.style.opacity=0;return}
    const b=h.getBoundingClientRect();if(b.bottom<-50||b.top>H){cv.style.opacity=0;return}
    const small=W<760;cv.style.opacity=small?.4:1;
    const hh=Math.tan(cam.fov*Math.PI/360)*cam.position.z,hw=hh*cam.aspect,unit=2*hh/H;
    const app=$("#app").getBoundingClientRect(),T=small?120:Math.min(170,W*.14);
    const px=small?W*.5:app.right-T-40,py=small?b.top+b.height*.45:b.top+b.height*.42;
    const s=T*unit/1.9;g.scale.setScalar(s);
    g.position.set((px/W*2-1)*hw,-(py/H*2-1)*hh+Math.sin(t*.001)*.12*s,0);
    cx+=(mx-cx)*.05;cy+=(my-cy)*.05;
    g.rotation.x=cy*.6+Math.sin(t*.0006)*.15;g.rotation.y=t*.0003+cx*.9+scrollY*.002;
    core.rotation.y=t*.0006;core.rotation.x=t*.0004;inner.rotation.x=t*.0012;inner.rotation.y=t*.0009;inner.scale.setScalar(1+Math.sin(t*.002)*.12);
    ring.rotation.z=t*.0005;ring2.rotation.y=t*.0004;pts.rotation.y=-t*.0002;
    R.render(sc,cam)}
  addEventListener("resize",size);size();requestAnimationFrame(frame)})();
/* ===== Scroll reveal ===== */
const io="IntersectionObserver"in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1}):null;
function reveal(){document.querySelectorAll(".rv").forEach(el=>io?io.observe(el):el.classList.add("in"))}
load();
</script>
