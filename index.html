<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SpyHub</title>
<style>
:root{--bg:#0f1318;--pn:#171c23;--ln:#262d37;--tx:#e8ecf1;--dim:#8a94a3;--ac:#60d68c;--bad:#ff5f69;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{font-size:20px;font-weight:700;letter-spacing:-.01em}
.chip{background:var(--pn);border:1px solid var(--ln);border-radius:999px;padding:5px 12px;font-weight:600;font-variant-numeric:tabular-nums}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:4px;margin-bottom:14px}
nav button{background:none;border:0;color:var(--dim);padding:9px 2px;border-radius:9px;font:inherit;font-size:13px;cursor:pointer}
nav button[aria-current=page]{background:var(--ln);color:var(--tx);font-weight:600}
.box{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 4px}
p{margin:.3em 0}.dim{color:var(--dim)}.bad{color:var(--bad)}.ok{color:var(--ac)}
a{color:var(--ac)}
button.pri{width:100%;background:var(--ac);color:#08140d;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
button.sec{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,.cell:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input[type=text]{width:100%;background:var(--bg);border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:11px;font:inherit;margin:8px 0}
input[type=range]{width:100%;accent-color:var(--ac)}
.line{display:flex;justify-content:space-between;gap:10px;align-items:center}
.tl{display:flex;gap:3px;overflow-x:auto;padding:6px 2px 10px;scroll-snap-type:x proximity}
.cell{flex:0 0 30px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:1px solid transparent;border-radius:8px;padding:4px 0;cursor:pointer;scroll-snap-align:start;color:var(--dim);font:inherit;font-size:11px}
.cell .lb{height:14px}
.cell i{display:block;width:16px;height:7px;border-radius:3px;border:1px solid var(--ac)}
.cell{flex-direction:column-reverse}
.cell .lb{order:9}
.cell i.on{background:var(--ln);border-color:var(--ln)}
.cell.full{cursor:not-allowed;opacity:.55}
.cell.sel{background:rgba(96,214,140,.16);border-color:var(--ac);color:var(--tx)}
.res{border-top:1px solid var(--ln);padding:10px 0}.res:first-child{border-top:0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:#0f1318;padding:10px 16px;border-radius:10px;font-weight:600;max-width:90%;z-index:9}
.demo{font-size:13px;color:var(--dim);border:1px dashed var(--ln);border-radius:10px;padding:8px 10px;margin-bottom:12px}
code{background:var(--bg);padding:2px 6px;border-radius:6px}
@media (prefers-reduced-motion:no-preference){.cell,button{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== Réglages =====
   DEMO=true : données fictives, aucun serveur nécessaire.
   Pour brancher la vraie API : DEMO=false et API_BASE="https://ton-worker.workers.dev" (routes /api/site/*, cookies de session). */
const CONFIG={DEMO:true,API_BASE:"",LOGIN_PATH:"/api/site/auth/discord",SEATS:4,STEP:30,MAX_MIN:120,HORIZON_H:24,PRICE_PER_HOUR:1/* tarif provisoire */};
const CELL=CONFIG.STEP*60000,$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+n.toFixed(2),hm=ms=>new Date(ms).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
const day=ms=>new Date(ms).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const dur=m=>m>=60?(m%60?Math.floor(m/60)+" h "+m%60:m/60+" h"):m+" min";
const S={me:null,tab:"book",start:null,dur:60,taken:{},busy:false};

/* ===== Mode démo ===== */
const M={in:false,balance:0,key:"spy_demo_"+Math.random().toString(16).slice(2,18),reset:0,res:[],codes:{"SPY.AJ_DEMO5":5,"SPY.AJ_DEMO10":10}};
const base=c=>(c*7+3)%5,own=c=>M.res.filter(r=>c>=r.start/CELL&&c<r.end/CELL).length;
function mock(path,body){
  const E=(status,error)=>({ok:false,status,data:{error}}),O=d=>({ok:true,status:200,data:d});
  if(path==="/me")return M.in?O({user:{name:"Démo"},balance:M.balance,license:{key:M.key,hwidBound:true,hwidResetAt:M.reset},reservations:M.res}):E(401,"Non connecté");
  if(!M.in)return E(401,"Non connecté");
  if(path.startsWith("/availability")){const q=new URLSearchParams(path.split("?")[1]),t={};for(let c=+q.get("from");c<=+q.get("to");c++)t[c]=Math.min(CONFIG.SEATS,base(c)+own(c));return O({taken:t})}
  if(path==="/reserve"){const{start,minutes}=body,a=start/CELL,n=minutes/CONFIG.STEP,price=CONFIG.PRICE_PER_HOUR*minutes/60;
    if(!(minutes>=CONFIG.STEP&&minutes<=CONFIG.MAX_MIN&&Number.isInteger(n)&&start>Date.now()))return E(400,"Créneau invalide");
    for(let i=0;i<n;i++)if(Math.min(CONFIG.SEATS,base(a+i)+own(a+i))>=CONFIG.SEATS)return E(409,"Ce créneau vient d'être pris");
    if(M.balance<price)return E(402,"Solde insuffisant");
    M.balance-=price;const r={id:Date.now(),start,end:start+minutes*60000,price};M.res.push(r);return O({balance:M.balance,reservation:r})}
  if(path==="/giftcard"){const c=String(body.code||"").trim().toUpperCase();if(!(c in M.codes))return E(404,"Code invalide ou déjà utilisé");M.balance+=M.codes[c];const v=M.codes[c];delete M.codes[c];return O({added:v,balance:M.balance})}
  if(path==="/hwid/reset"){const left=M.reset+864e5-Date.now();if(left>0)return E(429,"Prochain reset dans "+Math.ceil(left/36e5)+" h");M.reset=Date.now();return O({hwidResetAt:M.reset})}
  if(path==="/logout"){M.in=false;return O({})}
  return E(404,"Route inconnue");
}
async function api(path,body){
  if(CONFIG.DEMO)return mock(path,body);
  try{const r=await fetch(CONFIG.API_BASE+"/api/site"+path,{method:body?"POST":"GET",credentials:"include",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});
    let d={};try{d=await r.json()}catch{}return{ok:r.ok,status:r.status,data:d}}catch{return{ok:false,status:0,data:{error:"Serveur injoignable"}}}
}
function toast(t){document.querySelector(".toast")?.remove();const e=document.createElement("div");e.className="toast";e.setAttribute("role","status");e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}

/* ===== Créneaux ===== */
const first=()=>Math.floor(Date.now()/CELL)+1,count=()=>CONFIG.HORIZON_H*60/CONFIG.STEP;
const win=()=>S.start==null?[]:Array.from({length:S.dur/CONFIG.STEP},(_,i)=>S.start+i);
const winOk=()=>{const w=win();return w.length>0&&w.every(c=>c in S.taken&&S.taken[c]<CONFIG.SEATS)};
async function loadAvail(){const f=first(),r=await api(`/availability?from=${f}&to=${f+count()-1}`);if(r.ok)S.taken=r.data.taken}

/* ===== Vues ===== */
function gate(){return`<div class="box"><h2>Réserve ton créneau d'auto-join</h2><p class="dim">Connecte-toi avec Discord, choisis une heure et une durée (2 h maximum), paie avec ton solde.</p><button class="pri" data-act="login" style="margin-top:10px">Se connecter avec Discord</button></div>`+(CONFIG.DEMO?`<p class="demo">Mode démo : données fictives. Après connexion, utilise le code <code>SPY.AJ_DEMO5</code> dans l'onglet Gift card pour ajouter 5 $.</p>`:"")}
function book(){
  let cells="";const f=first();
  for(let i=0;i<count();i++){const c=f+i,t=S.taken[c]??0,ms=c*CELL,d=new Date(ms),full=t>=CONFIG.SEATS;
    cells+=`<button class="cell${full?" full":""}" data-act="cell" data-c="${c}" ${full?"disabled":""} aria-label="${hm(ms)}, ${CONFIG.SEATS-t} places libres"><span class="lb">${d.getMinutes()===0?d.getHours()+"h":""}</span>${Array.from({length:CONFIG.SEATS},(_,k)=>`<i class="${k<t?"on":""}"></i>`).join("")}</button>`}
  return`<div class="box"><h2>Quand ?</h2><p class="dim">Chaque colonne dure ${CONFIG.STEP} min. Les cases vertes sont des places libres sur ${CONFIG.SEATS}.</p><div class="tl" id="tl">${cells}</div>
  <div class="line"><label for="dur">Durée</label><b id="dl"></b></div><input id="dur" type="range" min="${CONFIG.STEP}" max="${CONFIG.MAX_MIN}" step="${CONFIG.STEP}" value="${S.dur}"></div>
  <div class="box"><div id="sum" aria-live="polite"></div></div><button class="pri" id="go" data-act="reserve" disabled>Réserver ce créneau</button>
  <p class="dim" style="margin-top:10px;font-size:13px">Le chrono court de l'heure de début à l'heure de fin, que tu sois connecté ou non.</p>`}
function upd(){
  const w=new Set(win());document.querySelectorAll(".cell").forEach(b=>b.classList.toggle("sel",w.has(+b.dataset.c)));
  $("#dl").textContent=dur(S.dur);const el=$("#sum"),btn=$("#go");
  if(S.start==null){el.innerHTML='<span class="dim">Touche une heure de départ dans la frise.</span>';btn.disabled=true;return}
  const ok=winOk(),price=CONFIG.PRICE_PER_HOUR*S.dur/60,after=S.me.balance-price,s=S.start*CELL,e=s+S.dur*60000;
  el.innerHTML=`<b>${day(s)}, de ${hm(s)} à ${hm(e)}</b><p>Prix : ${money(price)}. Solde après achat : ${money(Math.max(after,0))}.</p>`+(!ok?`<p class="bad">Il n'y a plus de place libre sur toute cette durée. Raccourcis-la ou change l'heure.</p>`:after<0?`<p class="bad">Solde insuffisant. <a href="#" data-act="tab" data-t="gift">Ajouter un gift card</a></p>`:"");
  btn.disabled=!ok||after<0||S.busy}
function mine(){
  const now=Date.now(),l=[...S.me.reservations].sort((a,b)=>a.start-b.start);
  if(!l.length)return`<div class="box"><h2>Aucun créneau</h2><p class="dim">Réserve ton premier créneau dans l'onglet Réserver.</p></div>`;
  return`<div class="box">`+l.map(r=>{const st=now<r.start?`<span class="dim">Commence dans ${dur(Math.max(1,Math.round((r.start-now)/6e4)))}</span>`:now<r.end?`<span class="ok">En cours, reste ${dur(Math.max(1,Math.round((r.end-now)/6e4)))}</span>`:`<span class="dim">Terminé</span>`;
    return`<div class="res"><b>${day(r.start)}</b><div class="line"><span>${hm(r.start)} à ${hm(r.end)}</span>${st}</div></div>`}).join("")+`</div>`}
const gift=()=>`<div class="box"><h2>Utiliser un gift card</h2><p class="dim">Le montant est ajouté à ton solde. Un code ne marche qu'une fois.</p><label for="code" class="dim">Code</label><input id="code" type="text" placeholder="SPY.AJ_XXXXXXXXXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="pri" data-act="redeem">Utiliser le code</button></div>`;
function account(){
  const l=S.me.license,left=l.hwidResetAt+864e5-Date.now(),can=left<=0;
  return`<div class="box"><h2>Ta licence</h2><p class="dim">Colle cette clé dans le script.</p><div class="line"><code id="key">spy_****${esc(l.key.slice(-4))}</code><span><button class="sec" data-act="show">Afficher</button> <button class="sec" data-act="copy">Copier</button></span></div></div>
  <div class="box"><h2>Appareil (HWID)</h2><p class="dim">${l.hwidBound?"Ta licence est liée à un appareil.":"Aucun appareil lié."} Tu peux le réinitialiser une fois par jour.</p><button class="sec" data-act="hwid" ${can?"":"disabled"} style="margin-top:8px">Réinitialiser le HWID</button>${can?"":`<p class="dim">Disponible dans ${Math.ceil(left/36e5)} h.</p>`}</div>
  <button class="sec" data-act="logout">Se déconnecter</button>`}

const TABS=[["book","Réserver"],["mine","Mes créneaux"],["gift","Gift card"],["account","Compte"]];
function render(){
  const app=$("#app"),bal=S.me?`<span class="chip" aria-label="Solde">${money(S.me.balance)}</span>`:"";
  app.innerHTML=`<header><span class="brand">SpyHub</span>${bal}</header>`+(S.me?`<nav>${TABS.map(([id,n])=>`<button data-act="tab" data-t="${id}" ${S.tab===id?'aria-current="page"':""}>${n}</button>`).join("")}</nav>`+({book,mine,gift,account}[S.tab])():gate());
  if(S.me&&S.tab==="book")upd()}
async function load(){const r=await api("/me");S.me=r.ok?{...r.data.user&&{user:r.data.user},balance:r.data.balance,license:r.data.license,reservations:r.data.reservations}:null;if(S.me)await loadAvail();render()}

/* ===== Actions ===== */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;if(a==="tab")e.preventDefault();
  if(a==="login"){if(CONFIG.DEMO){M.in=true;return load()}location.href=CONFIG.API_BASE+CONFIG.LOGIN_PATH}
  else if(a==="tab"){S.tab=b.dataset.t;if(S.tab==="book")await loadAvail();render()}
  else if(a==="cell"){S.start=+b.dataset.c;upd()}
  else if(a==="reserve"){S.busy=true;upd();const r=await api("/reserve",{start:S.start*CELL,minutes:S.dur});S.busy=false;
    if(r.ok){S.me.balance=r.data.balance;S.me.reservations.push(r.data.reservation);S.start=null;toast("Créneau réservé");await loadAvail();S.tab="mine";render()}
    else{toast(r.data.error||"Réservation impossible");await loadAvail();render()}}
  else if(a==="redeem"){const c=$("#code").value.trim();if(!c)return toast("Entre un code");const r=await api("/giftcard",{code:c});
    if(r.ok){S.me.balance=r.data.balance;toast(money(r.data.added)+" ajoutés à ton solde");render()}else toast(r.data.error||"Code refusé")}
  else if(a==="show"){$("#key").textContent=S.me.license.key}
  else if(a==="copy"){try{await navigator.clipboard.writeText(S.me.license.key);toast("Clé copiée")}catch{toast("Copie impossible, touche Afficher")}}
  else if(a==="hwid"){const r=await api("/hwid/reset",{});if(r.ok){S.me.license.hwidResetAt=r.data.hwidResetAt;S.me.license.hwidBound=false;toast("HWID réinitialisé");render()}else toast(r.data.error||"Reset impossible")}
  else if(a==="logout"){await api("/logout",{});S.me=null;S.tab="book";S.start=null;render()}
});
document.addEventListener("input",e=>{if(e.target.id==="dur"){S.dur=+e.target.value;upd()}});
setInterval(()=>{if(S.me&&S.tab==="mine")render()},30000);
load();
</script>
</body>
</html>
