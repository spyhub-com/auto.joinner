<style>
:root{--ln:rgba(255,255,255,.3);--dim:#8a8a8a;--bad:#ff6b76;color-scheme:dark}

body{margin:0;background:#05030f;color:#fff;font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;overflow-x:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

/* ===== 3D layer ===== */
#planet{position:fixed;left:76vw;top:60vh;width:min(1000px,135vmin);aspect-ratio:1;transform:translate(-50%,-50%);z-index:0;pointer-events:none;opacity:.28;transition:opacity .8s ease;will-change:transform}body.home #planet{opacity:1}@media(max-width:760px){#planet{left:64vw;top:80vh;width:150vmin}}
.rv{transform:perspective(900px) rotateX(14deg) translateY(34px);transform-origin:50% 100%}
.rv.in{transform:none}
.tilt{position:relative;transform-style:preserve-3d;will-change:transform;transition:transform .25s ease,border-color .3s ease,box-shadow .3s ease}
.tilt.mv{transition:border-color .3s ease,box-shadow .3s ease}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(150,220,255,.28),transparent 55%);opacity:0;transition:opacity .3s}
.tilt:hover::after{opacity:1}
.tilt:hover{box-shadow:0 14px 36px -16px rgba(236,72,153,.6)}
.box{background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01));}
.b.s{box-shadow:0 0 26px rgba(56,189,248,.5)}
.b:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 28px -6px rgba(139,92,246,.8)}
main.pg{animation:pg .6s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes pg{from{opacity:0;transform:perspective(1000px) rotateX(8deg) translateY(22px)}}
.pod .pc{animation:rise 1s cubic-bezier(.2,.8,.2,1) backwards;transform-origin:50% 100%}
.pod .pc.p0{animation-delay:.25s}.pod .pc.p1{animation-delay:.1s}.pod .pc.p2{animation-delay:.4s}
@keyframes rise{from{opacity:0;transform:perspective(700px) rotateX(-50deg) translateY(80px)}}
.pod .pc.p0{box-shadow:0 0 40px -8px rgba(139,92,246,.8);border-color:rgba(160,225,255,.8)}
@media(hover:none){.tilt::after{display:none}}
@media(prefers-reduced-motion:reduce){.pod .pc,main.pg{animation:none}.rv{transform:none}.tilt{transform:none!important}}
/* ===== Aurora (light) ===== */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#05031a}
.aurora i{position:absolute;width:90vw;height:90vh;border-radius:50%;will-change:transform}
.aurora i:nth-child(1){left:-30vw;top:-35vh;background:radial-gradient(closest-side,rgba(56,189,248,.13),transparent);animation:au1 22s ease-in-out infinite alternate}
.aurora i:nth-child(2){right:-35vw;top:-10vh;background:radial-gradient(closest-side,rgba(124,58,237,.2),transparent);animation:au2 26s ease-in-out infinite alternate}
.aurora i:nth-child(3){left:-10vw;bottom:-45vh;background:radial-gradient(closest-side,rgba(236,72,153,.06),transparent);animation:au2 30s ease-in-out infinite alternate-reverse}
.aurora i:nth-child(4){right:-30vw;bottom:-40vh;background:radial-gradient(closest-side,rgba(30,27,107,.55),transparent);animation:au1 28s ease-in-out infinite alternate-reverse}
@keyframes au1{to{transform:translate3d(14vw,10vh,0)}}
@keyframes au2{to{transform:translate3d(-14vw,12vh,0)}}
@media(prefers-reduced-motion:reduce){.aurora i{animation:none}}
/* ===== Refined hero ===== */
header{margin-top:12px;padding:6px 7px 6px 18px;border-color:rgba(255,255,255,.13);background:rgba(10,8,30,.55);box-shadow:none}
.brand{font-size:15px}
.hero{min-height:calc(100vh - 300px);max-width:600px}

.hero .lead{font-size:clamp(14px,2vw,16px);max-width:40ch;text-wrap:balance}
.hero .cta{margin-top:26px;gap:10px}.hero .b{padding:10px 22px;font-size:14px}
.b.s{background:#fff;color:#000;border-color:#fff;box-shadow:0 0 28px rgba(192,132,252,.35)}

main{padding-top:0}
/* ===== Buttons ===== */
.b{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.05);transition:transform .25s ease,box-shadow .25s ease,background .25s ease,border-color .25s ease,color .25s ease}
.b:hover:not(:disabled){background:rgba(255,255,255,.12);color:#fff;border-color:rgba(167,139,250,.9);transform:translateY(-2px);box-shadow:0 10px 30px -10px rgba(139,92,246,.8)}

/* ===== Small buttons (final) ===== */
.b{padding:8px 16px;font-size:13px;font-weight:600;border-radius:10px;background:transparent;border:1px solid rgba(255,255,255,.22);box-shadow:none}
.b:hover:not(:disabled){background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.5);transform:none;box-shadow:none}

/* ===== 24h logs chart ===== */
.lgc{padding:22px 24px;border-radius:24px;background:rgba(12,10,32,.82)}
.lgc h2.t{font-size:clamp(20px,3.4vw,30px);letter-spacing:-.03em;margin:0 0 6px;color:#fff;-webkit-text-fill-color:#fff;background:none}

.ch3d .tip b{display:block;margin-bottom:4px;color:#c4b5fd}.ch3d .tip div{display:flex;justify-content:space-between;gap:14px;align-items:center}.ch3d .tip i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}

<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div><canvas id="fx" aria-hidden="true"></canvas><canvas id="planet" aria-hidden="true"></canvas>
<div id="app"></div>
<script>
/* ===== Settings: put your Worker URL in API_BASE and fill in the legal details ===== */
const CONFIG={API_BASE:"https://spyhub-finder.spyuhq.workers.dev",LOGIN_PATH:"/api/site/auth/discord",SEATS:4,STEP:30,MAX_MIN:120,HORIZON_H:24,PRICE_PER_HOUR:1,
  LEGAL:{publisher:"",country:"",email:""}};
const CELL=CONFIG.STEP*60000,A="/api/site",$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+(+n||0).toFixed(2),hm=ms=>new Date(ms).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"});
const day=ms=>new Date(ms).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
const dur=m=>m>=60?(m%60?Math.floor(m/60)+" h "+m%60:m/60+" h"):m+" min";
const fmt=n=>{n=+n||0;for(const[u,v]of[["B",1e9],["M",1e6],["K",1e3]])if(n>=v)return"$"+(n/v).toFixed(1)+u+"/s";return"$"+Math.round(n)+"/s"};
const ago=t=>{const s=Math.max(1,Math.round((Date.now()-t)/1e3));return(s<60?s+"s":s<3600?Math.round(s/60)+"m":Math.round(s/3600)+"h")+" ago"};
const S={me:null,tab:"home",start:null,dur:60,taken:{},busy:false,f:"a",notif:true,end:0,stats:null,list:null,lb:null,err:""};

/* ===== Network (Bearer token on /api/site routes) ===== */
const tok=()=>{try{return localStorage.getItem("spyaj_t")||""}catch{return""}},setTok=t=>{try{t?localStorage.setItem("spyaj_t",t):localStorage.removeItem("spyaj_t")}catch{}};
{const m=location.hash.match(/[#&]t=([\w.-]+)/);if(m){setTok(m[1]);history.replaceState(null,"",location.pathname)}}
async function api(path,body){
  if(!CONFIG.API_BASE)return{ok:false,status:0,data:{error:"API not configured: set CONFIG.API_BASE"}};
  try{const r=await fetch(CONFIG.API_BASE+path,{method:body?"POST":"GET",credentials:"include",headers:{...(body?{"Content-Type":"application/json"}:{}),...(tok()&&path.startsWith(A)?{Authorization:"Bearer "+tok()}:{})},body:body?JSON.stringify(body):undefined});
    let d={};try{d=await r.json()}catch{}if(!r.ok&&!d.error)d.error=r.status===404?"API not found (404), check CONFIG.API_BASE":"Error "+r.status;return{ok:r.ok,status:r.status,data:d}}
  catch{return{ok:false,status:0,data:{error:"Server unreachable (wrong URL or CORS)"}}}
}
function toast(t){document.querySelector(".toast")?.remove();const e=document.createElement("div");e.className="toast";e.setAttribute("role","status");e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}

/* ===== Data ===== */
const first=()=>Math.floor(Date.now()/CELL)+1,count=()=>CONFIG.HORIZON_H*60/CONFIG.STEP;
const win=()=>S.start==null?[]:Array.from({length:S.dur/CONFIG.STEP},(_,i)=>S.start+i);
const winOk=()=>{const w=win();return w.length>0&&w.every(c=>c in S.taken&&S.taken[c]<CONFIG.SEATS)};
async function loadAvail(){if(!S.me)return;const f=first(),r=await api(`${A}/availability?from=${f}&to=${f+count()-1}`);if(r.ok)S.taken=r.data.taken||{}}
async function loadStats(){
  const[a,b]=await Promise.all([api("/api/stats"),api("/api/brainrots?limit=10&sort=mps")]);
  S.err=a.ok?"":(a.data.error||"");S.stats=a.ok?a.data:null;const d=b.data;S.list=b.ok?(Array.isArray(d)?d:d.brainrots||d.items||[]):null;
  if(S.tab==="stats")paintStats()}
async function loadBoard(){const r=await api(`${A}/leaderboard?range=${S.f}`);S.lb=r.ok?(r.data.rows||[]):null;if(S.tab==="board")render()}
async function load(){
  const r=await api(A+"/me");
  S.me=r.ok?{user:r.data.user,balance:r.data.balance||0,hours:r.data.hours||0,gifts:r.data.gifts||[],stats:r.data.stats,license:r.data.license||{key:"",hwidResetAt:0},reservations:r.data.reservations||[]}:null;
  if(S.me)await loadAvail();render()}

/* ===== Views ===== */
const STEPS=[["Sign in","Log in with your Discord account."],["Book a slot","Pick a start time and a duration."],["Run the script","Paste your key and let the auto-join work."]];
const FAQ=[["What if I don't connect during my slot?","The slot keeps running, you just don't use it."],["How many people at once?","4 users maximum per slot."],["How do I pay?","With your balance, topped up by gift card. There is no subscription."],["I changed device, what now?","Reset your HWID from Settings, once per day."],["Is it affiliated with Roblox?","No. SpyHub AJ is independent. See the Legal Notice."]];
const ctas=`<div class="cta"><button class="b s" data-act="dash">Get Dashboard</button><button class="b" data-act="tab" data-t="stats">Live Stats</button></div>`;
const home=()=>`<section class="hero rv"><h1>SpyHub Auto Joinner</h1><p class="lead">Spots the best brainrots live and joins the right server for you. Book a slot, run the script, that's it.</p>${ctas}</section>
<section class="sec rv"><div class="box lgc"><h2 class="t">Logs — Last 24 Hours</h2><p class="dim" style="margin:0">Finds and frozen sessions per hour. Move your mouse to rotate.</p><div class="ch3d"></div></div></section>`;
const none=t=>`<p class="dim">${t}</p>`;
function statsHtml(){
  const s=S.stats,l=S.list;
  if(!s&&!l)return`<div class="box"><h2>Live Stats</h2>${none("Data unavailable."+(S.err?" "+esc(S.err)+".":""))}</div>`;
  const c=(k,v)=>`<div class="box"><span class="dim">${k}</span><div class="big">${v}</div></div>`;
  return(s?`<div class="grid g4">${c("In database",s.total??"—")}${c("Today",s.activeToday??"—")}${c("Active scanners",s.scanners??"—")}${c("Top value",s.topMps!=null?fmt(s.topMps):"—")}</div>`:"")
